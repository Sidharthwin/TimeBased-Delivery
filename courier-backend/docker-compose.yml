services:
  postgres:
    image: postgres:17
    container_name: courier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in courier-backend/.env}
    ports:
      - "5433:5432"
    volumes:
      - courier_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courier_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  courier_data:
    external: true
    name: courier_data
