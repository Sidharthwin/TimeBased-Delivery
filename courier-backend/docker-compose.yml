services:
  postgres:
    image: postgres:17-alpine
    container_name: courier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courier_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - courier_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courier_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  courier_postgres_data:
